<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 Tech day 2026 — заметки</title>
<style>
:root{
  --red:#E30613; --red-dark:#B8050F; --red-tint:#FDECEE;
  --black:#000; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4; --bg:#fff; --soft:#f6f6f6;
  --shadow:0 2px 10px rgba(0,0,0,.08);--surface:#fff;--red-text:#E30613;color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit}
input,textarea,.item,.chip span{color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
:root[data-theme="dark"]{--black:#fff;--ink:#f2f2f2;--muted:#a8a8a8;--line:#363636;--bg:#0e0e0e;--soft:#141414;--surface:#1c1c1c;--red-tint:#3a1216;--red-text:#ff5a64;--shadow:0 2px 14px rgba(0,0,0,.5);color-scheme:dark}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:3px solid var(--red);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo b{background:var(--red);color:#fff;border-radius:8px;padding:2px 9px 3px;font-weight:800}
.logo span{color:var(--ink);font-weight:800;letter-spacing:-.025em}
.logo .year{font-style:normal;font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--red-text);border:1.5px solid var(--red);border-radius:999px;padding:1px 10px 2px;line-height:1.3}
@media (max-width:420px){.logo{font-size:19px}.logo .year{font-size:13px;padding:0 8px 1px}}
.spacer{flex:1}
.count{color:var(--muted);font-size:14px}
.icon-btn{padding:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--black);background:var(--surface);color:var(--black);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--black);color:var(--surface)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.danger{border-color:var(--line);color:var(--red-text)}
.btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--soft)}
.search{padding:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.search input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.search input:focus{border-color:var(--black);outline:none}
#list{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
#list li{margin:0 0 6px}
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid transparent;border-radius:8px;padding:12px 14px;cursor:pointer;display:block}
.item:hover{border-color:#cfcfcf;border-left-color:#cfcfcf}
.item.active{border-left-color:var(--red);background:var(--red-tint);border-color:var(--red-tint);border-left-color:var(--red)}
.item .name{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .unp{font-size:13px;color:var(--muted)}
.none{padding:20px;color:var(--muted);text-align:center;font-size:14px}

main{overflow-y:auto;min-width:0}
.card{max-width:720px;margin:32px auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card h1{color:var(--ink);margin:0 0 24px;font-size:24px;letter-spacing:-.01em}
.back{display:none;margin-bottom:16px;padding:8px 12px}
.field{margin-bottom:20px}
label.t,.legend{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input[type=text],.field input[type=tel],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface)}
.field textarea{resize:vertical;min-height:120px;line-height:1.5}
.field textarea:focus,.field input:focus{border-color:var(--black);outline:none}
.field input.bad,.field textarea.bad{border-color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.hint.err{color:var(--red-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{background:var(--surface);display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:500}
.chip span small{color:var(--muted);font-weight:400}
.chip input:checked+span{border-color:var(--red);background:var(--red-tint);color:var(--ink)}
.chip input:checked+span::before{content:"✓";color:var(--red);font-weight:800}
.chip input:focus-visible+span{outline:2px solid var(--black);outline-offset:2px}
.actions{display:flex;gap:12px;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.status{color:var(--muted);font-size:13px}

.empty{max-width:420px;margin:12vh auto;text-align:center;padding:24px}
.empty .mark{width:64px;height:64px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;margin:0 auto 20px}
.empty h2{margin:0 0 8px;color:var(--ink)}
.empty p{color:var(--muted);margin:0 0 24px}

dialog{background:var(--surface);color:var(--ink);border:none;border-radius:12px;padding:24px;max-width:380px;width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px;color:var(--ink)}
dialog p{margin:0 0 20px;color:var(--muted)}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--surface);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:760px){
  header{padding:12px 16px}
  .count{display:none}
  .layout{display:block;position:relative}
  aside{height:100%;border-right:none}
  main{display:none;height:100%;background:var(--surface)}
  .layout.open aside{display:none}
  .layout.open main{display:block}
  .card{margin:0;border:none;border-radius:0;box-shadow:none;padding:20px 16px;max-width:none}
  .back{display:inline-flex}
  .grid2{grid-template-columns:1fr;gap:0}
  .actions{flex-wrap:wrap}
  .empty{margin:6vh auto}
}

.about-link{margin:0;padding:12px 16px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--muted);text-align:left;cursor:pointer;font-size:13px}
.about-link:hover{color:var(--ink)}
dialog.about{max-width:420px;text-align:center;padding:28px 24px 22px}
.about .ph{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;padding:4px;background:var(--red);cursor:pointer;transition:background .4s,box-shadow .4s;-webkit-tap-highlight-color:transparent}
.about .ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--surface)}
.about.sunset .ph{background:linear-gradient(135deg,#ffb347,#E30613 60%,#5b2a86);box-shadow:0 0 28px rgba(255,140,40,.55)}
.about small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.about h3{font-size:20px;margin:0 0 4px}
.about .role{font-weight:700;margin:0 0 2px;color:var(--ink)}
.about p{margin:0 0 6px;color:var(--muted);font-size:14px}
.about a{color:var(--red-text);font-weight:600;text-decoration:none}
.about .egg{min-height:20px;margin:12px 0 0;color:var(--red-text);font-weight:600;font-size:14px}
.about .row{margin-top:14px;justify-content:center}
.about .aform{text-align:left;display:grid;gap:10px;margin-top:4px}
.about .aform[hidden],.about [hidden]{display:none}
.about .aform label{font-size:12px;font-weight:600;color:var(--muted);display:block}
.about .aform input[type=text],.about .aform input[type=tel]{width:100%;margin-top:3px;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:400}
.about .aform input:focus{border-color:var(--black);outline:none}
.about .qr.hide{display:none}
.about dialog-scroll{display:block}
dialog.about{max-height:calc(100% - 32px);overflow-y:auto}

.about .qr{margin:14px auto 0;width:150px}
.about .qr img{width:150px;height:150px;display:block;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}
.about .qr small{margin:6px 0 0;font-size:12px}


.acwrap{position:relative}
.aclist{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1.5px solid var(--black);border-radius:8px;box-shadow:var(--shadow);z-index:20;max-height:280px;overflow-y:auto}
.aclist[hidden]{display:none}
.aclist li{padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.aclist li.on,.aclist li:hover{background:var(--red-tint)}
.aclist .cnt{color:var(--muted);font-size:12px;white-space:nowrap}
.aclist mark{background:none;color:var(--red-text);font-weight:700}
.picker{margin:-8px 0 20px}
.picker .plist{max-height:min(420px,50vh);overflow-y:auto;padding-right:2px}
.picker .ptitle{font-size:14px;font-weight:600;margin-bottom:6px}
.picker .psub{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.pcard:hover{border-color:#cfcfcf}
.pcard.sel{border-color:var(--red);background:var(--red-tint)}
.pcard b{display:block}
.pcard span{display:block;font-size:13px;color:var(--muted)}
.pcard.sel b::before{content:"✓ ";color:var(--red-text)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:1000;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

      '<div class="grid2"><div class="field"><label class="t" for="f_unp">УНП</label><input type="text" id="f_unp" inputmode="numeric" maxlength="9" value="'+esc(n.unp)+'" autocomplete="off"><div class="hint" id="unpHint">9 цифр</div></div>'+
      '<div class="field"><label class="t" for="f_phone">Контактный номер</label><input type="tel" id="f_phone" value="'+esc(n.phone)+'" placeholder="+375 29 123-45-67" autocomplete="off"></div></div>'+
      '<div class="field"><label class="t" for="f_lpr">ЛПР</label><input type="text" id="f_lpr" value="'+esc(n.lpr)+'" placeholder="ФИО, должность" autocomplete="off"></div>'+
      '<div class="field"><label class="t" for="f_pitch">Заметка по проведённому спичу</label><textarea id="f_pitch" rows="6" placeholder="Что озвучили, реакция клиента, возражения, договорённости, следующий шаг">'+esc(n.pitch||'')+'</textarea></div>'+
      '<div class="field"><span class="legend">Интерес по продуктам</span><div class="chips">'+
      PRODUCTS.map(function(p){return '<label class="chip"><input type="checkbox" value="'+p.id+'"'+(n.products.indexOf(p.id)>-1?' checked':'')+'><span>'+p.label+' <small>'+p.sub+'</small></span></label>'}).join('')+
      '</div></div>'+
      '<div class="actions"><button class="btn primary" id="save">Сохранить</button>'+
      (isNew?'<button class="btn" id="cancel">Отмена</button>':'<button class="btn danger" id="del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Удалить</button>')+
      '<span class="status" id="status">'+(isNew?'':'Изменения сохраняются автоматически')+'</span></div></div>';
    bindForm(isNew);
    if(isNew)$('f_org').focus();
  }

  function readForm(n){
    n.org=$('f_org').value.trim();
    n.unp=$('f_unp').value.replace(/\D/g,'').slice(0,9);
    n.lpr=$('f_lpr').value.trim();
    n.phone=$('f_phone').value.trim();
    n.pitch=$('f_pitch').value;
    n.products=[].slice.call(main.querySelectorAll('.chips input:checked')).map(function(i){return i.value});
  }
  function checkUnp(){
    var v=$('f_unp').value.replace(/\D/g,''), h=$('unpHint'), ok=!v||v.length===9;
    $('f_unp').classList.toggle('bad',!ok);h.classList.toggle('err',!ok);
    h.textContent=ok?'9 цифр':'Введите 9 цифр, сейчас '+v.length;
    return ok;
  }

  // ---- Справочник организаций (из списка регистраций) ----
  var LEGAL=/(^|[^0-9a-z\u0430-\u044f])(\u043e\u043e\u043e|\u043e\u0430\u043e|\u0437\u0430\u043e|\u0443\u043f|\u0447\u0443\u043f|\u0447\u043f|\u043e\u0434\u043e|\u0438\u043f|\u0441\u043e\u043e\u043e|\u043e\u043e|ao|oao|ooo)(?=[^0-9a-z\u0430-\u044f]|$)/g;
  function nk(c){
    c=String(c==null?'':c).toLowerCase().replace(/\u0451/g,'\u0435').replace(/[\u00ab\u00bb"\u201c\u201d'`]/g,' ');
    c=c.replace(LEGAL,'$1 ');
    return c.replace(/[^0-9a-z\u0430-\u044f]+/g,' ').trim();
  }
  DIR.forEach(function(o){
    o.name=o[0];o.k=nk(o[0]);
    var seen={},out=[];
    o[1].forEach(function(p){
      var key=String(p[0]).toLowerCase().replace(/\s+/g,' ').trim(),q=seen[key];
      if(!q){q=p.slice();seen[key]=q;out.push(q);return}
      if(!q[1]&&p[1])q[1]=p[1];
      if(!q[2]&&p[2])q[2]=p[2];
      if(p[3]&&(q[3]||'').toLowerCase().indexOf(p[3].toLowerCase())<0)q[3]=q[3]?q[3]+', '+p[3]:p[3];
    });
    o.people=out;
  });
  function findOrg(name){var k=nk(name);if(!k)return null;for(var i=0;i<DIR.length;i++)if(DIR[i].k===k)return DIR[i];return null}
  function searchOrgs(q){
    var nq=nk(q),ql=q.trim().toLowerCase();
    if(ql.length<2)return [];
    var toks=nq?nq.split(' '):[],res=[];
    for(var i=0;i<DIR.length;i++){
      var o=DIR[i],sc=-1;
      if(toks.length){
        var ok=toks.every(function(t){return o.k.indexOf(t)>-1});
        if(ok)sc=o.k.indexOf(nq)===0?0:(o.k.indexOf(' '+nq)>-1?1:2);
      }else if(o.name.toLowerCase().indexOf(ql)>-1)sc=2;
      if(sc>-1)res.push([sc,o]);
    }
    res.sort(function(a,b){return a[0]-b[0]||a[1].name.localeCompare(b[1].name,'ru')});
    return res.slice(0,8).map(function(r){return r[1]});
  }
  function hl(name,q){
    var t=q.trim();if(!t)return esc(name);
    var i=name.toLowerCase().indexOf(t.toLowerCase());
    if(i<0)return esc(name);
    return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+t.length))+'</mark>'+esc(name.slice(i+t.length));
  }
  function plural(n){var m=n%10,h=n%100;return n+' '+((m===1&&h!==11)?'сотрудник':((m>=2&&m<=4&&(h<12||h>14))?'сотрудника':'сотрудников'))}
  function personLine(p){return p[1]?p[0]+', '+p[1]:p[0]}
  function fire(id){var el=$(id);if(el)el.dispatchEvent(new Event('input',{bubbles:true}))}
  var autoPhone='';
  function applyPerson(p){
    $('f_lpr').value=personLine(p);
    if(p[2]){$('f_phone').value=p[2];autoPhone=p[2]}
    fire('f_lpr');fire('f_phone');
  }
  function renderPicker(){
    var box=$('picker'),hint=$('dirHint');if(!box)return;
    var o=findOrg($('f_org').value);
    if(!o){box.hidden=true;box.innerHTML='';hint.textContent='Начните вводить — организация подставится из списка регистраций';return}
    var cur=$('f_lpr').value.trim().toLowerCase();
    hint.textContent='В списке регистраций: '+plural(o.people.length);
    box.hidden=false;
    box.innerHTML='<div class="ptitle">'+(o.people.length>1?'С кем велась коммуникация?':'Зарегистрированный сотрудник')+'</div>'+
      (o.people.length>1?'<div class="psub">Несколько сотрудников зарегистрировано от этой организации. Выберите нужного — ЛПР и номер заполнятся.</div>':'')+
      '<div class="plist">'+o.people.map(function(p,i){
        var sel=cur&&cur.indexOf(p[0].toLowerCase())===0;
        return '<button type="button" class="pcard'+(sel?' sel':'')+'" data-i="'+i+'"><b>'+esc(p[0])+'</b>'+(p[1]?'<span>'+esc(p[1])+'</span>':'')+'<span>'+esc([p[2],p[3]].filter(Boolean).join(' · '))+'</span></button>';
      }).join('')+'</div>';
    [].forEach.call(box.querySelectorAll('.pcard'),function(b){
      b.onclick=function(){applyPerson(o.people[+b.getAttribute('data-i')]);renderPicker()};
    });
  }
  function bindOrgAutocomplete(){
    var inp=$('f_org'),ul=$('acList'),items=[],act=-1,quiet=false;
    function close(){ul.hidden=true;inp.setAttribute('aria-expanded','false');act=-1}
    function mark(){[].forEach.call(ul.children,function(li,i){li.classList.toggle('on',i===act)})}
    function show(){
      var q=inp.value;items=searchOrgs(q);
      if(!items.length){close();return}
      ul.innerHTML=items.map(function(o,i){return '<li role="option" data-i="'+i+'"><span>'+hl(o.name,q)+'</span><span class="cnt">'+o.people.length+' чел.</span></li>'}).join('');
      ul.hidden=false;inp.setAttribute('aria-expanded','true');act=-1;
    }
    function choose(o){
      inp.value=o.name;quiet=true;fire('f_org');quiet=false;close();
      if(o.people.length===1)applyPerson(o.people[0]);
      else if(o.people.length>1){$('f_lpr').value='';if(autoPhone&&$('f_phone').value===autoPhone){$('f_phone').value='';autoPhone=''}fire('f_lpr');fire('f_phone')}
      renderPicker();
    }
    inp.addEventListener('input',function(){if(!quiet)show();renderPicker()});
    inp.addEventListener('focus',function(){if(inp.value.trim().length>=2)show()});
    inp.addEventListener('blur',function(){setTimeout(close,150)});
    inp.addEventListener('keydown',function(e){
      if(ul.hidden)return;
      if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%items.length;mark()}
      else if(e.key==='ArrowUp'){e.preventDefault();act=(act-1+items.length)%items.length;mark()}
      else if(e.key==='Enter'&&act>-1){e.preventDefault();choose(items[act])}
      else if(e.key==='Escape'){close()}
    });
    ul.addEventListener('mousedown',function(e){
      var li=e.target.closest('li');if(!li)return;
      e.preventDefault();choose(items[+li.getAttribute('data-i')]);
    });
    $('f_lpr').addEventListener('input',renderPicker);
    renderPicker();
  }
  function bindForm(isNew){
    $('back').onclick=function(){activeId=null;draft=null;render()};
    var u=$('f_unp');
    u.addEventListener('input',function(){u.value=u.value.replace(/\D/g,'').slice(0,9);checkUnp()});
    main.oninput=onEdit;main.onchange=onEdit;
    bindOrgAutocomplete();
    function onEdit(){
      if(isNew||!current())return;
      var n=current();readForm(n);
      if(!checkUnp())return;
      $('status').textContent='Сохраняю…';
      clearTimeout(timer);
      timer=setTimeout(function(){
        if(persist()){$('status')&&($('status').textContent='Сохранено');renderList();var h=main.querySelector('h1');if(h)h.textContent=n.org||'Без названия'}
      },400);
    }
    $('save').onclick=function(){
      var n=current();readForm(n);
      if(!n.org){$('f_org').classList.add('bad');$('f_org').focus();toast('Укажите название организации');return}
      if(!checkUnp()){u.focus();return}
      if(isNew){n.id=uid();notes.unshift(n);activeId=n.id;draft=null}
      if(persist()){toast('Заметка сохранена');render()}
    };
    if(isNew)$('cancel').onclick=function(){draft=null;render()};
    else $('del').onclick=function(){
      var n=current();pendingDelete=n.id;
      $('dlgText').textContent='Заметка «'+(n.org||'Без названия')+'» будет удалена. Это действие нельзя отменить.';
      $('dlg').showModal();
    };
  }

  function startNew(){draft=blank();activeId=null;render();main.scrollTop=0}
  function render(){renderList();renderMain()}

  list.addEventListener('click',function(e){
    var b=e.target.closest('.item');if(!b)return;
    clearTimeout(timer);draft=null;activeId=b.getAttribute('data-id');render();main.scrollTop=0;
  });
  $('newBtn').onclick=startNew;
  $('q').addEventListener('input',renderList);
  $('dlgNo').onclick=function(){$('dlg').close()};
  $('dlgYes').onclick=function(){
    notes=notes.filter(function(n){return n.id!==pendingDelete});
    persist();activeId=null;$('dlg').close();render();toast('Заметка удалена');
  };
  var taps=0,tapT=null;
  function confetti(){
    var cols=['#E30613','#000','#fff','#ffb347'];
    for(var i=0;i<60;i++){
      var d=document.createElement('i');d.className='conf';
      d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
      d.style.border='1px solid rgba(0,0,0,.25)';
      d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=(Math.random()*.4)+'s';
      document.body.appendChild(d);setTimeout(function(x){x.remove()},4500,d);
    }
  }
  $('aboutBtn').onclick=function(){aSetMode(false);taps=0;$('about').classList.remove('sunset');$('egg').textContent='';$('about').showModal()};

  // ---- Редактирование окна «Разработчик» ----
  var ABOUT_KEY='a1_about_v1';
  var A_DEF={label:'Разработчик',name:'Карчевский Илья Юрьевич',role:'Специалист',dept:'Служба бизнес-продаж региона Центр',company:'Унитарное предприятие A1, A1-центр, Минск',addr:'ул. Интернациональная, 36-2, 220030, Минск, Республика Беларусь',phone:'+375 29 310 07 03',email:'i.karcheuski@a1.by',site:'www.a1.by'};
  var phImg=document.querySelector('#ph img');
  var A_DEF_PHOTO=phImg.getAttribute('src');
  var aData=null,pendingPhoto=null,curPhoto=null;
  function aLoad(){
    var d={};for(var k in A_DEF)d[k]=A_DEF[k];
    try{var r=JSON.parse(localStorage.getItem(ABOUT_KEY)||'null');
      if(r&&typeof r==='object'){for(var k2 in A_DEF){if(typeof r[k2]==='string')d[k2]=r[k2]}
        curPhoto=(typeof r.photo==='string'&&r.photo.indexOf('data:image/')===0)?r.photo:null}}catch(e){}
    return d;
  }
  function aRender(){
    var q=document.querySelectorAll('#aView [data-k]');
    for(var i=0;i<q.length;i++){var k=q[i].getAttribute('data-k');q[i].textContent=aData[k];(q[i].tagName==='A'?q[i].parentNode:q[i]).hidden=!aData[k]}
    var ph=aData.phone.replace(/[^\d+]/g,'');
    $('lnkPhone').href='tel:'+ph;
    $('lnkMail').href='mailto:'+aData.email;
    var u=aData.site.trim();$('lnkSite').href=/^https?:\/\//i.test(u)?u:'https://'+u;
    phImg.src=curPhoto||A_DEF_PHOTO;
    // QR относится к исходной визитке: скрываем, если контакты изменены
    var same=['name','phone','email'].every(function(k){return aData[k]===A_DEF[k]});
    document.querySelector('.about .qr').classList.toggle('hide',!same);
  }
  function aSetMode(edit){
    $('aView').hidden=edit;$('aForm').hidden=!edit;
    $('rowView').hidden=edit;$('rowEdit').hidden=!edit;
    if(edit){
      var f=document.querySelectorAll('#aForm [data-f]');
      for(var i=0;i<f.length;i++)f[i].value=aData[f[i].getAttribute('data-f')];
      pendingPhoto=null;
    }
  }
  function aPersist(){
    var o={};for(var k in aData)o[k]=aData[k];
    if(curPhoto)o.photo=curPhoto;
    try{localStorage.setItem(ABOUT_KEY,JSON.stringify(o));return true}catch(e){toast('Не удалось сохранить: хранилище недоступно');return false}
  }
  function aResizePhoto(file,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var n=320,c=document.createElement('canvas');c.width=c.height=n;
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,n,n);
        cb(c.toDataURL('image/jpeg',0.85));
      };
      im.onerror=function(){toast('Не удалось открыть изображение')};
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }
  aData=aLoad();aRender();
  $('aboutEdit').onclick=function(){aSetMode(true)};
  $('aboutCancel').onclick=function(){phImg.src=curPhoto||A_DEF_PHOTO;pendingPhoto=null;aSetMode(false)};
  $('photoBtn').onclick=function(){$('photoFile').click()};
  $('photoFile').onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;
    aResizePhoto(f,function(url){pendingPhoto=url;phImg.src=url});
    this.value='';
  };
  $('aboutSave').onclick=function(){
    var f=document.querySelectorAll('#aForm [data-f]'),d={};
    for(var i=0;i<f.length;i++)d[f[i].getAttribute('data-f')]=f[i].value.trim();
    if(!d.name){toast('Укажите ФИО');return}
    aData=d;if(pendingPhoto)curPhoto=pendingPhoto;pendingPhoto=null;
    if(aPersist()){aRender();aSetMode(false);toast('Сохранено')}
  };
  $('aReset').onclick=function(){
    aData={};for(var k in A_DEF)aData[k]=A_DEF[k];
    curPhoto=null;pendingPhoto=null;
    try{localStorage.removeItem(ABOUT_KEY)}catch(e){}
    aRender();aSetMode(true);toast('Исходные данные восстановлены');
  };
  $('aboutClose').onclick=function(){$('about').close()};
  $('ph').onclick=function(){
    taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0},1500);
    if(taps>=5){taps=0;$('about').classList.add('sunset');$('egg').textContent='Пасхалка найдена. Удачных продаж на Tech day 2026!';confetti()}
  };
  var THEME_KEY='a1_theme';
  var ICONS={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'};
  function setTheme(t,save){
    document.documentElement.setAttribute('data-theme',t);
    $('themeIcon').innerHTML=t==='dark'?ICONS.sun:ICONS.moon;
    $('themeBtn').title=t==='dark'?'Светлая тема':'Тёмная тема';
    if(save){try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
  }
  var saved=null;try{saved=localStorage.getItem(THEME_KEY)}catch(e){}
  setTheme(saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),false);
  $('themeBtn').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true)};
  render();
})();
</script>
